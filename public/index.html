<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Items - New</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { margin-bottom: 1rem; }
    form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
    input { flex: 1; padding: .5rem; font-size: 1rem; }
    button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { padding: .6rem .8rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: .4rem; }
    .status { min-height: 1.4em; margin-bottom: 1rem; }
    .error { color: #b00020; }
    .empty { color: #777; }
  </style>
</head>
<body>
  <main data-testid="app">
    <h1 data-testid="page-title">Items</h1>

    <form data-testid="add-item-form" id="add-item-form">
      <input data-testid="item-name-input" id="item-name" name="name" placeholder="Item name" required autocomplete="off">
      <button data-testid="add-item-submit" type="submit">Add</button>
    </form>

    <div class="status" data-testid="status" id="status" role="status" aria-live="polite"></div>

    <p class="empty" data-testid="empty-state" id="empty-state" hidden>No items yet.</p>
    <ul data-testid="item-list" id="item-list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
